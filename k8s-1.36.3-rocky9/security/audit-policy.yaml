apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  - level: None
    users:
      - system:kube-proxy
    verbs:
      - watch
    resources:
      - group: ""
        resources:
          - endpoints
          - services
          - services/status
  - level: None
    users:
      - system:unsecured
    namespaces:
      - kube-system
    verbs:
      - get
    resources:
      - group: ""
        resources:
          - configmaps
  - level: Metadata
    resources:
      - group: ""
        resources:
          - secrets
          - configmaps
      - group: authentication.k8s.io
        resources:
          - tokenreviews
      - group: authorization.k8s.io
        resources:
          - subjectaccessreviews
  - level: RequestResponse
    verbs:
      - create
      - update
      - patch
      - delete
      - deletecollection
    resources:
      - group: rbac.authorization.k8s.io
        resources:
          - clusterrolebindings
          - rolebindings
          - clusterroles
          - roles
      - group: admissionregistration.k8s.io
      - group: apiextensions.k8s.io
        resources:
          - customresourcedefinitions
  - level: Metadata
    omitStages:
      - RequestReceived
